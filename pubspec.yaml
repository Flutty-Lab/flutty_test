name: flutty_test
description: "Testing utilities, helpers and matchers for Flutty packages."
version: 0.3.0
homepage: https://github.com/Flutty-Lab/flutty_test
repository: https://github.com/Flutty-Lab/flutty_test
issue_tracker: https://github.com/Flutty-Lab/flutty_test/issues
topics:
  - testing
  - golden-tests
  - test-utilities

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"


dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_test:
    sdk: flutter
  meta: ^1.16.0

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  fonts:
    - family: Roboto
      fonts:
        - asset: packages/flutty_test/fonts/Roboto-Regular.ttf
